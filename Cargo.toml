[package]
name = "spoor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
inquire = "0.9.4"
jiff = { version = "0.2.39", features = ["serde"] }
owo-colors = "4.4.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
x509-parser = { version = "0.18.1", features = ["aws-lc-rs"] }
